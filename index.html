<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">نظام إدارة المستودعات وفروع المطاعم</title>
    <!-- استخدام Tailwind CSS عبر CDN لتصميم فوري وبدون عقد بناء -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- شريط التنقل العلوي -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-2 rounded-xl text-lg">M</div>
            <span class="font-bold text-lg tracking-wide" data-i18n="brand_name">نظام المستودعات</span>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- زر تبديل اللغة -->
            <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                English
            </button>
            <a href="login.html" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition" data-i18n="login_btn">تسجيل الدخول</a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-5xl mx-auto px-6 py-16 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 leading-tight" data-i18n="hero_title">
            الربط الذكي بين المستودع الرئيسي وفروع مطاعمك
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto mb-10" data-i18n="hero_desc">
            أدر مخزونك، تتبع طلبات التوريد لكل فرع بدقة، وتحكم بالكميات الحية بلحظة واحدة وبدون أي تعقيد.
        </p>
        <div class="flex justify-center gap-4">
            <a href="login.html" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition" data-i18n="start_now">
                ابدأ الآن
            </a>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-slate-500 text-sm">
        <span data-i18n="footer_text">جميع الحقوق محفوظة © نظام المستودعات والفروع 2026</span>
    </footer>

    <!-- محرك الترجمة البسيط -->
    <script src="assets/js/i18n.js"></script>
</body>
</html>
