<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login_title">تسجيل الدخول - Keymerv Warehouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- شريط علوي بسيط -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <a href="index.html" class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-2 rounded-xl text-lg">K</div>
            <span class="font-bold text-lg tracking-wide" data-i18n="brand_name">Keymerv Warehouse</span>
        </a>
        <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition">
            English
        </button>
    </header>

    <!-- محتوى صفحة الدخول -->
    <main class="max-w-md mx-auto px-6 py-12 w-full flex-1 flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl space-y-4">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold" data-i18n="login_heading">تسجيل دخول الفروع والمستودع</h1>
                <p class="text-slate-400 text-xs leading-relaxed" data-i18n="system_description">
                    النظام الإداري الذكي لإدارة المخزون، تنظيم سلاسل التوريد، ومتابعة حركة التغذية للفروع بدقة وسرعة فائقة.
                </p>
            </div>
            
            <p class="text-slate-500 text-xs text-center mb-6" data-i18n="login_subheading">أدخل بيانات الاعتماد الخاصة بحسابك والمعتمدة من الإدارة العامة</p>

            <!-- نموذج تسجيل الدخول -->
            <form id="login-form" class="space-y-4">
                <!-- مكان ظهور رسالة الخطأ -->
                <div id="error-message" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-2.5 rounded-xl text-xs text-center font-medium"></div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" data-i18n="email_label">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="name@keymerv.com" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" data-i18n="password_label">كلمة المرور</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition mt-2 text-sm" data-i18n="login_btn_action">
                    دخول لوحة التحكم
                </button>
            </form>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-slate-500 text-xs">
        <span data-i18n="footer_text">جميع الحقوق محفوظة © 2026 - Keymerv Warehouse (أحد مشاريع منصة Keymerv Platform)</span>
    </footer>

    <!-- الترجمة ومنطق تسجيل الدخول معاً -->
    <script>
        const loginTranslations = {
            ar: {
                login_title: "تسجيل الدخول - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                login_heading: "تسجيل دخول الفروع والمستودع",
                system_description: "النظام الإداري الذكي لإدارة المخزون، تنظيم سلاسل التوريد، ومتابعة حركة التغذية للفروع بدقة وسرعة فائقة.",
                login_subheading: "أدخل بيانات الاعتماد الخاصة بحسابك والمعتمدة من الإدارة العامة",
                email_label: "البريد الإلكتروني",
                password_label: "كلمة المرور",
                login_btn_action: "دخول لوحة التحكم",
                footer_text: "جميع الحقوق محفوظة © 2026 - Keymerv Warehouse (أحد مشاريع منصة Keymerv Platform)"
            },
            en: {
                login_title: "Login - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                login_heading: "Branch & Warehouse Login",
                system_description: "The smart administrative system for inventory management, supply chain coordination, and branch replenishment tracking.",
                login_subheading: "Enter your account credentials provided by general administration",
                email_label: "Email Address",
                password_label: "Password",
                login_btn_action: "Access Dashboard",
                footer_text: "All Rights Reserved © 2026 - Keymerv Warehouse (A Keymerv Platform Project)"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'ar';

        function applyLoginLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) {
                langBtn.innerText = lang === 'ar' ? 'English' : 'العربية';
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (loginTranslations[lang] && loginTranslations[lang][key]) {
                    element.innerText = loginTranslations[lang][key];
                }
            });
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLoginLanguage(newLang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLoginLanguage(currentLang);
        });
    </script>

    <!-- سكربت الاتصال بقاعدة البيانات وتسجيل الدخول -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://jpsybjkydhvoslrnwkoj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vRZkK2oAh-1SjWzSX0BcLQ_1TNHbKqO';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('login-form');
        const errorMessageDiv = document.getElementById('error-message');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                
                if (errorMessageDiv) {
                    errorMessageDiv.classList.add('hidden');
                    errorMessageDiv.innerText = '';
                }

                if (!email || !password) {
                    if (errorMessageDiv) {
                        errorMessageDiv.innerText = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور';
                        errorMessageDiv.classList.remove('hidden');
                    }
                    return;
                }

                const originalText = submitBtn.innerText;
                submitBtn.innerText = 'جاري التحقق...';
                submitBtn.disabled = true;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    // إذا نجح الدخول
                    window.location.href = 'dashboard.html';

                } catch (error) {
                    let message = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                    if (error.message && error.message.includes('Invalid login credentials')) {
                        message = 'خطأ: البريد الإلكتروني أو كلمة المرور غير مطابقة';
                    } else if (error.message) {
                        message = error.message;
                    }

                    if (errorMessageDiv) {
                        errorMessageDiv.innerText = message;
                        errorMessageDiv.classList.remove('hidden');
                    }

                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
