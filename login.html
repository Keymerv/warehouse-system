<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login_title">تسجيل الدخول - Keymerv Warehouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- شريط علوي بسيط -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <a href="index.html" class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-2 rounded-xl text-lg">K</div>
            <span class="font-bold text-lg tracking-wide" data-i18n="brand_name">Keymerv Warehouse</span>
        </a>
        <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition">
            English
        </button>
    </header>

    <!-- محتوى صفحة الدخول -->
    <main class="max-w-md mx-auto px-6 py-12 w-full flex-1 flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
            <h1 class="text-2xl font-bold mb-2 text-center" data-i18n="login_heading">تسجيل الدخول للنظام</h1>
            <p class="text-slate-400 text-sm text-center mb-8" data-i18n="login_subheading">اختر الطريقة المناسبة لدخول المستودع أو فروع المطاعم</p>

            <!-- أزرار تسجيل الدخول السريع (بدون استهلاك بريد) -->
            <div class="space-y-4">
                <!-- Google Login -->
                <button class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition border border-slate-700">
                    <span data-i18n="google_login">المتابعة باستخدام Google</span>
                </button>

                <!-- GitHub Login -->
                <button class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition border border-slate-700">
                    <span data-i18n="github_login">المتابعة باستخدام GitHub</span>
                </button>
            </div>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-4 text-slate-500 text-xs" data-i18n="or_divider">أو دخول الفروع السريع</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- نموذج كود الفرع السريع (لتوفير رسائل البريد) -->
            <form action="dashboard.html" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1" data-i18n="branch_code_label">كود الفرع أو اسم المستخدم</label>
                    <input type="text" placeholder="e.g. branch-riyadh-01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1" data-i18n="password_label">كلمة المرور</label>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition" data-i18n="login_btn_action">
                    دخول لوحة التحكم
                </button>
            </form>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="w-full text-center py-6 border-t border-slate-900 text-slate-500 text-sm">
        <span data-i18n="footer_text">جميع الحقوق محفوظة © 2026 - Keymerv Warehouse (أحد مشاريع Keymerv Platform)</span>
    </footer>

    <!-- محرك الترجمة -->
    <script>
        const loginTranslations = {
            ar: {
                login_title: "تسجيل الدخول - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                login_heading: "تسجيل الدخول للنظام",
                login_subheading: "اختر الطريقة المناسبة لدخول المستودع أو فروع المطاعم",
                google_login: "المتابعة باستخدام Google",
                github_login: "المتابعة باستخدام GitHub",
                or_divider: "أو دخول الفروع السريع",
                branch_code_label: "كود الفرع أو اسم المستخدم",
                password_label: "كلمة المرور",
                login_btn_action: "دخول لوحة التحكم",
                footer_text: "جميع الحقوق محفوظة © 2026 - Keymerv Warehouse (أحد مشاريع Keymerv Platform)"
            },
            en: {
                login_title: "Login - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                login_heading: "System Login",
                login_subheading: "Choose your preferred method to access warehouse or branches",
                google_login: "Continue with Google",
                github_login: "Continue with GitHub",
                or_divider: "Or Quick Branch Login",
                branch_code_label: "Branch Code or Username",
                password_label: "Password",
                login_btn_action: "Access Dashboard",
                footer_text: "All Rights Reserved © 2026 - Keymerv Warehouse (A Keymerv Platform Project)"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'ar';

        function applyLoginLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) {
                langBtn.innerText = lang === 'ar' ? 'English' : 'العربية';
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (loginTranslations[lang] && loginTranslations[lang][key]) {
                    element.innerText = loginTranslations[lang][key];
                }
            });
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLoginLanguage(newLang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLoginLanguage(currentLang);
        });
    </script>
</body>
</html>
