<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="branches_title">إدارة الفروع والبراندات - Keymerv Warehouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
    <script type="module" src="assets/js/auth-guard.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex h-screen overflow-hidden text-xs">

    <!-- القائمة الجانبية -->
    <aside class="w-64 bg-slate-900 border-l border-slate-800 flex flex-col justify-between shrink-0">
        <div>
            <div class="p-4 border-b border-slate-800 flex items-center gap-2">
                <div class="bg-indigo-600 text-white font-bold px-2 py-1 rounded-lg text-xs">K</div>
                <span class="font-bold text-xs tracking-tight text-slate-200" data-i18n="brand_name">Keymerv Warehouse</span>
            </div>

            <nav class="p-3 space-y-1.5">
                <a href="dashboard.html" class="flex items-center gap-2.5 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition" data-i18n="nav_overview">الرئيسية</a>
                <a href="orders.html" class="flex items-center gap-2.5 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition" data-i18n="nav_orders">طلبات التغذية</a>
                <a href="supply.html" class="flex items-center gap-2.5 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition" data-i18n="nav_supply">التوريد والموردين</a>
                <a href="inventory.html" class="flex items-center gap-2.5 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition" data-i18n="nav_inventory">إدارة المخزون</a>
                <a href="branches.html" class="flex items-center gap-2.5 px-3 py-2 bg-indigo-600 text-white rounded-lg font-medium transition" data-i18n="nav_branches">الفروع</a>
                <a href="settings.html" class="flex items-center gap-2.5 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition" data-i18n="nav_settings">الإعدادات</a>
            </nav>
        </div>

        <div class="p-3 border-t border-slate-800 flex items-center justify-between">
            <div>
                <p class="font-bold text-slate-200 text-xs" data-i18n="user_role_admin">الإدارة العامة (المالك)</p>
                <p class="text-[10px] text-slate-400">admin@keymerv.com</p>
            </div>
            <a href="login.html" class="text-rose-400 hover:text-rose-300 text-[11px] font-semibold" data-i18n="logout">خروج</a>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-slate-900 border-b border-slate-800 px-5 py-3 flex justify-between items-center">
            <h1 class="text-sm font-bold" data-i18n="branches_header">إدارة البراندات والفروع</h1>
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="lang-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-md text-xs font-medium transition">
                    English
                </button>
            </div>
        </header>

        <div class="p-5 space-y-4">
            
            <!-- إحصائيات علوية سريعة -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl flex items-center justify-between">
                    <div class="w-9 h-9 bg-indigo-600/10 text-indigo-400 rounded-lg flex items-center justify-center font-bold text-sm">🍔</div>
                    <div class="text-left md:text-right">
                        <p class="text-slate-400 text-[11px]" data-i18n="stat_total_brands">إجمالي البراندات</p>
                        <h3 id="total-brands-count" class="text-lg font-extrabold mt-0.5 text-indigo-400">0</h3>
                    </div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl flex items-center justify-between">
                    <div class="w-9 h-9 bg-emerald-600/10 text-emerald-400 rounded-lg flex items-center justify-center font-bold text-sm">🏢</div>
                    <div class="text-left md:text-right">
                        <p class="text-slate-400 text-[11px]" data-i18n="stat_total_branches">إجمالي الفروع النشطة</p>
                        <h3 id="total-branches-count" class="text-lg font-extrabold mt-0.5 text-emerald-400">0</h3>
                    </div>
                </div>
            </div>

            <!-- شريط الفلترة والأزرار -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <div class="flex flex-wrap items-center gap-2" id="filter-buttons-container">
                    <span class="text-slate-400 text-[11px] font-semibold ml-2" data-i18n="filter_label">تصفية حسب:</span>
                    <button onclick="filterBranches('all')" id="btn-all" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition" data-i18n="filter_all">كل البراندات</button>
                </div>

                <button onclick="openAddBranchModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition shadow-md shadow-indigo-600/20" data-i18n="add_branch_btn">
                    + إضافة فرع / براند جديد
                </button>
            </div>

            <!-- قائمة الفروع -->
            <div class="space-y-3" id="branches-container">
                <div class="text-center py-8 text-slate-500" data-i18n="no_branches_msg">لا توجد فروع أو براندات مضافة حالياً.</div>
            </div>
        </div>
    </main>

    <!-- نافذة إضافة فرع جديد (مع خيار صورة الشعار للبراند) -->
    <div id="add-branch-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 w-full max-w-lg space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-slate-100" data-i18n="modal_title">إضافة فرع أو براند جديد</h3>
                <button onclick="closeAddBranchModal()" class="text-slate-400 hover:text-white text-base">&times;</button>
            </div>
            
            <form id="add-branch-form" class="space-y-4">
                
                <!-- اختيار البراند -->
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2.5">
                    <label class="block text-indigo-400 text-[11px] font-bold" data-i18n="select_brand_type">اختيار البراند التابع له الفرع:</label>
                    <div class="flex items-center gap-4 text-xs">
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="radio" name="brand_type" id="type-existing-brand" value="existing" checked onclick="toggleBrandInputType()" class="text-indigo-600 focus:ring-0 bg-slate-900 border-slate-700">
                            <span data-i18n="type_existing">براند موجود مسبقاً</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                            <input type="radio" name="brand_type" id="type-new-brand" value="new" onclick="toggleBrandInputType()" class="text-indigo-600 focus:ring-0 bg-slate-900 border-slate-700">
                            <span data-i18n="type_new">+ براند جديد</span>
                        </label>
                    </div>

                    <!-- اختيار براند موجود -->
                    <div id="existing-brand-container" class="pt-1">
                        <select id="existing-brand-select" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs">
                            <option value="">-- اختر البراند --</option>
                        </select>
                    </div>

                    <!-- إضافة براند جديد مع الصورة المصغرة -->
                    <div id="new-brand-container" class="space-y-3 hidden pt-1">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_brand_ar">اسم البراند (بالعربي)</label>
                                <input type="text" id="brand-name-ar" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="مثال: براند مطاعم البرجر">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_brand_en">اسم البراند (بالإنجليزي)</label>
                                <input type="text" id="brand-name-en" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="e.g. Burger Restaurant Brand">
                            </div>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_brand_logo">رابط صورة الشعار (Logo URL) - اختياري</label>
                            <input type="url" id="brand-logo-url" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="https://example.com/logo.png (سيطبق على كل فروع البراند)">
                        </div>
                    </div>
                </div>

                <!-- أسماء الفرع -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_branch_ar">اسم الفرع (بالعربي)</label>
                        <input type="text" id="branch-name-ar" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="مثال: فرع التحلية">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_branch_en">اسم الفرع (بالإنجليزي)</label>
                        <input type="text" id="branch-name-en" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="e.g. Tahlia Branch">
                    </div>
                </div>

                <!-- العنوان أو الموقع -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_location_ar">العنوان / الموقع (بالعربي)</label>
                        <input type="text" id="branch-location-ar" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="مثال: شارع التحلية، الرياض">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[11px] mb-1" data-i18n="label_location_en">العنوان / الموقع (بالإنجليزي)</label>
                        <input type="text" id="branch-location-en" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-xs" placeholder="e.g. Tahlia Street, Riyadh">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeAddBranchModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-medium transition" data-i18n="btn_cancel">إلغاء</button>
                    <button type="submit" id="save-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg font-medium transition" data-i18n="btn_save">حفظ الفرع</button>
                </div>
            </form>
        </div>
    </div>

    <!-- السكربت 1: مستقل تماماً عن قواعد البيانات ومسؤول عن الأزرار والترجمة والفلترة -->
    <script>
        let allBranchesData = [];
        let currentLang = localStorage.getItem('lang') || 'ar';
        let currentFilter = 'all'; // لتثبيت الفلتر الحالي حتى عند التحديث أو تغيير اللغة

        const branchesTranslations = {
            ar: {
                branches_title: "إدارة الفروع والبراندات - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                nav_overview: "الرئيسية",
                nav_inventory: "إدارة المخزون",
                nav_orders: "طلبات التغذية",
                nav_supply: "التوريد والموردين",
                nav_branches: "الفروع",
                nav_settings: "الإعدادات",
                user_role_admin: "الإدارة العامة (المالك)",
                logout: "خروج",
                branches_header: "إدارة البراندات والفروع",
                stat_total_brands: "إجمالي البراندات",
                stat_total_branches: "إجمالي الفروع النشطة",
                filter_label: "تصفية حسب:",
                filter_all: "كل البراندات",
                add_branch_btn: "+ إضافة فرع / براند جديد",
                status_active: "نشط",
                edit_manager_btn: "تعديل المدير",
                no_branches_msg: "لا توجد فروع أو براندات مضافة حالياً.",
                modal_title: "إضافة فرع أو براند جديد",
                select_brand_type: "اختيار البراند التابع له الفرع:",
                type_existing: "براند موجود مسبقاً",
                type_new: "+ براند جديد",
                label_branch_ar: "اسم الفرع (بالعربي)",
                label_branch_en: "اسم الفرع (بالإنجليزي)",
                label_brand_ar: "اسم البراند (بالعربي)",
                label_brand_en: "اسم البراند (بالإنجليزي)",
                label_brand_logo: "رابط صورة الشعار (Logo URL) - اختياري",
                label_location_ar: "العنوان / الموقع (بالعربي)",
                label_location_en: "العنوان / الموقع (بالإنجليزي)",
                btn_cancel: "إلغاء",
                btn_save: "حفظ الفرع",
                location_text: "الموقع:",
                status_text: "الحالة:",
                select_brand_placeholder: "-- اختر البراند --"
            },
            en: {
                branches_title: "Branches & Brands - Keymerv Warehouse",
                brand_name: "Keymerv Warehouse",
                nav_overview: "Overview",
                nav_inventory: "Inventory",
                nav_orders: "Replenishment Orders",
                nav_supply: "Suppliers",
                nav_branches: "Branches",
                nav_settings: "Settings",
                user_role_admin: "General Admin (Owner)",
                logout: "Logout",
                branches_header: "Brands & Branches",
                stat_total_brands: "Total Brands",
                stat_total_branches: "Active Branches",
                filter_label: "Filter by:",
                filter_all: "All Brands",
                add_branch_btn: "+ Add New Branch / Brand",
                status_active: "Active",
                edit_manager_btn: "Edit Manager",
                no_branches_msg: "No branches or brands added yet.",
                modal_title: "Add New Branch or Brand",
                select_brand_type: "Select Brand for this Branch:",
                type_existing: "Existing Brand",
                type_new: "+ New Brand",
                label_branch_ar: "Branch Name (Arabic)",
                label_branch_en: "Branch Name (English)",
                label_brand_ar: "Brand Name (Arabic)",
                label_brand_en: "Brand Name (English)",
                label_brand_logo: "Brand Logo URL - Optional",
                label_location_ar: "Address / Location (Arabic)",
                label_location_en: "Address / Location (English)",
                btn_cancel: "Cancel",
                btn_save: "Save Branch",
                location_text: "Location:",
                status_text: "Status:",
                select_brand_placeholder: "-- Select Brand --"
            }
        };

        // دوال فتح وإغلاق النافذة
        function openAddBranchModal() {
            const modal = document.getElementById('add-branch-modal');
            if (modal) {
                populateExistingBrandsSelect();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeAddBranchModal() {
            const modal = document.getElementById('add-branch-modal');
            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function toggleBrandInputType() {
            const isNew = document.getElementById('type-new-brand').checked;
            const existingContainer = document.getElementById('existing-brand-container');
            const newContainer = document.getElementById('new-brand-container');
            const brandArInput = document.getElementById('brand-name-ar');
            const brandEnInput = document.getElementById('brand-name-en');
            const existingSelect = document.getElementById('existing-brand-select');

            if (isNew) {
                existingContainer.classList.add('hidden');
                newContainer.classList.remove('hidden');
                brandArInput.required = true;
                brandEnInput.required = true;
                existingSelect.required = false;
            } else {
                existingContainer.classList.remove('hidden');
                newContainer.classList.add('hidden');
                brandArInput.required = false;
                brandEnInput.required = false;
                existingSelect.required = true;
            }
        }

        // الترجمة الفورية
        function applyBranchesLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            
            const htmlRoot = document.getElementById('html-root');
            if (htmlRoot) {
                htmlRoot.setAttribute('lang', lang);
                htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            }

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) {
                langBtn.innerText = lang === 'ar' ? 'English' : 'العربية';
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (branchesTranslations[lang] && branchesTranslations[lang][key]) {
                    element.innerText = branchesTranslations[lang][key];
                }
            });

            updateStatsAndFilters(allBranchesData);
            renderBranches(allBranchesData);
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            applyBranchesLanguage(newLang);
        }

        // نظام الفلترة المحدث والمستقر
        function filterBranches(brandId) {
            currentFilter = brandId; // حفظ الفلتر النشط حالياً

            document.querySelectorAll('#filter-buttons-container button').forEach(btn => {
                btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition";
            });
            const activeBtn = document.getElementById('btn-' + brandId);
            if (activeBtn) {
                activeBtn.className = "bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition";
            }

            const cards = document.querySelectorAll('.branch-card');
            cards.forEach(card => {
                if (brandId === 'all' || card.getAttribute('data-brand') === brandId) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // رسم كروت الفروع مع الشعار وتطبيق الفلتر المحفوظ تلقائياً
        function renderBranches(branches) {
            const container = document.getElementById('branches-container');
            if (!container) return;

            if (branches.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500">${branchesTranslations[currentLang].no_branches_msg}</div>`;
                return;
            }

            container.innerHTML = branches.map(b => {
                let namesArr = (b.name || '').split(' / ');
                let branchName = currentLang === 'ar' ? (namesArr[0] || b.name) : (namesArr[1] || namesArr[0] || b.name);
                
                let brandMatch = (b.location || '').match(/\[Brand:\s*(.*?)\s*-\s*(.*?)\]/);
                let brandAr = brandMatch ? brandMatch[1] : 'براند عام';
                let brandEn = brandMatch ? brandMatch[2] : 'General Brand';
                let brandName = currentLang === 'ar' ? brandAr : brandEn;
                let brandClass = brandEn.trim().replace(/\s+/g, '-').toLowerCase();

                let logoMatch = (b.location || '').match(/\[Logo:\s*(.*?)\]/);
                let logoUrl = logoMatch ? logoMatch[1].trim() : '';

                let locWithoutBrand = (b.location || '').replace(/\[Brand:.*?\]/, '').replace(/\[Logo:.*?\]/, '').trim();
                let locParts = locWithoutBrand.split(' / ');
                let cleanLocation = currentLang === 'ar' ? (locParts[0] || locWithoutBrand) : (locParts[1] || locParts[0] || locWithoutBrand);

                let imageHtml = logoUrl ? 
                    `<img src="${logoUrl}" alt="${brandName}" onerror="this.outerHTML='<div class=\\\'w-9 h-9 bg-indigo-600/10 text-indigo-400 rounded-lg flex items-center justify-center font-bold text-sm\\\'>🏢</div>'" class="w-9 h-9 rounded-lg object-cover border border-slate-700 shrink-0">` : 
                    `<div class="w-9 h-9 bg-indigo-600/10 text-indigo-400 rounded-lg flex items-center justify-center font-bold text-sm shrink-0">🏢</div>`;

                return `
                <div class="branch-card bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3" data-brand="${brandClass}">
                    <div class="flex items-start gap-3.5">
                        ${imageHtml}
                        <div>
                            <span class="text-[10px] font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">${brandName}</span>
                            <h3 class="font-bold text-sm text-slate-100 mt-1">${branchName}</h3>
                            <p class="text-[11px] text-slate-400 mt-0.5">${branchesTranslations[currentLang].location_text} <span class="font-mono text-slate-200">${cleanLocation || 'غير محدد'}</span> | ${branchesTranslations[currentLang].status_text} ${b.status || 'نشط'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2.5 w-full md:w-auto justify-between md:justify-end">
                        <span class="bg-emerald-500/10 text-emerald-400 px-2.5 py-0.5 rounded-full text-[11px] font-semibold">${b.status || branchesTranslations[currentLang].status_active}</span>
                        <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-medium transition">${branchesTranslations[currentLang].edit_manager_btn}</button>
                    </div>
                </div>`;
            }).join('');

            // إعادة تطبيق الفلتر الحالي بعد إعادة الرسم لضمان استمراره
            filterBranches(currentFilter);
        }

        // تحديث الإحصائيات وأزرار الفلترة مع الحفاظ على التحديد النشط
        function updateStatsAndFilters(branches) {
            const totalBranchesEl = document.getElementById('total-branches-count');
            if (totalBranchesEl) totalBranchesEl.innerText = branches.length;

            const uniqueBrandsMap = new Map();
            branches.forEach(b => {
                let m = (b.location || '').match(/\[Brand:\s*(.*?)\s*-\s*(.*?)\]/);
                let bAr = m ? m[1].trim() : 'براند عام';
                let bEn = m ? m[2].trim() : 'General Brand';
                let key = bEn.replace(/\s+/g, '-').toLowerCase();
                uniqueBrandsMap.set(key, { ar: bAr, en: bEn });
            });
            
            const totalBrandsEl = document.getElementById('total-brands-count');
            if (totalBrandsEl) totalBrandsEl.innerText = branches.length === 0 ? 0 : uniqueBrandsMap.size;

            const filterContainer = document.getElementById('filter-buttons-container');
            if (!filterContainer) return;

            let filterHtml = `<span class="text-slate-400 text-[11px] font-semibold ml-2" data-i18n="filter_label">${branchesTranslations[currentLang].filter_label}</span>
                              <button onclick="filterBranches('all')" id="btn-all" class="${currentFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'} px-3 py-1.5 rounded-lg text-xs font-semibold transition" data-i18n="filter_all">${branchesTranslations[currentLang].filter_all}</button>`;

            uniqueBrandsMap.forEach((val, key) => {
                let name = currentLang === 'ar' ? val.ar : val.en;
                let isActive = currentFilter === key;
                let btnClass = isActive ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300';
                filterHtml += `<button onclick="filterBranches('${key}')" id="btn-${key}" class="${btnClass} px-3 py-1.5 rounded-lg text-xs font-semibold transition">${name}</button>`;
            });

            filterContainer.innerHTML = filterHtml;
        }

        // تعبئة قائمة البراندات
        function populateExistingBrandsSelect() {
            const select = document.getElementById('existing-brand-select');
            const uniqueBrands = new Map();
            allBranchesData.forEach(b => {
                let m = (b.location || '').match(/\[Brand:\s*(.*?)\s*-\s*(.*?)\]/);
                let l = (b.location || '').match(/\[Logo:\s*(.*?)\]/);
                let logoUrl = l ? l[1].trim() : '';
                
                if (m) {
                    let key = `${m[1].trim()}|${m[2].trim()}|${logoUrl}`;
                    uniqueBrands.set(key, { ar: m[1].trim(), en: m[2].trim() });
                }
            });

            const existingRadio = document.getElementById('type-existing-brand');
            const newRadio = document.getElementById('type-new-brand');

            if (uniqueBrands.size === 0) {
                newRadio.checked = true;
                if(existingRadio) existingRadio.disabled = true;
                toggleBrandInputType();
            } else {
                if(existingRadio) {
                    existingRadio.disabled = false;
                    existingRadio.checked = true;
                }
                toggleBrandInputType();
                
                let optionsHtml = `<option value="">${branchesTranslations[currentLang].select_brand_placeholder}</option>`;
                uniqueBrands.forEach((val, key) => {
                    optionsHtml += `<option value="${key}">${currentLang === 'ar' ? val.ar : val.en} (${val.ar} / ${val.en})</option>`;
                });
                select.innerHTML = optionsHtml;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyBranchesLanguage(currentLang);
        });
    </script>

    <!-- السكربت 2: مسؤول فقط عن الاتصال بقاعدة البيانات Supabase والحفظ -->
    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        async function fetchBranches() {
            try {
                const { data, error } = await supabase.from('branches').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                allBranchesData = data || [];
                updateStatsAndFilters(allBranchesData);
                renderBranches(allBranchesData);
            } catch (err) {
                console.error('Error fetching branches:', err);
            }
        }

        const addForm = document.getElementById('add-branch-form');
        if (addForm) {
            addForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const isNewBrand = document.getElementById('type-new-brand').checked;
                let brand_ar = '', brand_en = '', logo_url = '';

                if (isNewBrand) {
                    brand_ar = document.getElementById('brand-name-ar').value.trim();
                    brand_en = document.getElementById('brand-name-en').value.trim();
                    logo_url = document.getElementById('brand-logo-url').value.trim();
                } else {
                    const selectVal = document.getElementById('existing-brand-select').value;
                    if (!selectVal) {
                        alert(currentLang === 'ar' ? 'الرجاء اختيار براند من القائمة' : 'Please select a brand');
                        return;
                    }
                    const parts = selectVal.split('|');
                    brand_ar = parts[0];
                    brand_en = parts[1];
                    logo_url = parts[2] || '';
                }

                const branch_ar = document.getElementById('branch-name-ar').value.trim();
                const branch_en = document.getElementById('branch-name-en').value.trim();
                const loc_ar = document.getElementById('branch-location-ar').value.trim();
                const loc_en = document.getElementById('branch-location-en').value.trim();

                const full_name = `${branch_ar} / ${branch_en}`;
                let full_location = `${loc_ar} / ${loc_en} [Brand: ${brand_ar} - ${brand_en}]`;
                if (logo_url) {
                    full_location += ` [Logo: ${logo_url}]`;
                }
                
                const saveBtn = document.getElementById('save-btn');
                saveBtn.disabled = true;
                saveBtn.innerText = currentLang === 'ar' ? 'جاري الحفظ...' : 'Saving...';

                try {
                    const { error } = await supabase.from('branches').insert([{
                        name: full_name,
                        location: full_location,
                        status: 'نشط'
                    }]);

                    if (error) throw error;

                    closeAddBranchModal();
                    addForm.reset();
                    await fetchBranches();
                } catch (err) {
                    alert('حدث خطأ أثناء الحفظ: ' + err.message);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerText = branchesTranslations[currentLang].btn_save;
                }
            });
        }

        // جلب البيانات فور تحميل الموديل
        fetchBranches();
    </script>
</body>
</html>
