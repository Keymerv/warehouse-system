<!DOCTYPE html>
<html id="html-root" lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keymerv - إدارة المخزون</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tajawal Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar / Header -->
    <header class="bg-slate-900/80 border-b border-slate-800 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-indigo-500/20">
                    K
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 tracking-wide text-lg">Keymerv</h1>
                    <p class="text-[11px] text-slate-400" data-i18n="subtitle">نظام إدارة المخزون والمنتجات</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="lang-btn" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">
                    English
                </button>
                <button onclick="logoutUser()" class="px-3 py-1.5 text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-lg transition" data-i18n="logout">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400" data-i18n="stat_total">إجمالي المنتجات</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-slate-100 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-xl">
                    📦
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400" data-i18n="stat_low">موشك على النفاد</p>
                    <h3 id="stat-low" class="text-2xl font-bold text-amber-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xl">
                    ⚠️
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400" data-i18n="stat_out">منتهي من المخزون</p>
                    <h3 id="stat-out" class="text-2xl font-bold text-rose-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-lg bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 text-xl">
                    🚫
                </div>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
            <!-- Search & Filter -->
            <div class="flex flex-wrap items-center gap-3 flex-grow max-w-2xl">
                <div class="relative flex-grow">
                    <input type="text" id="search-input" onkeyup="filterInventory()" data-i18n-placeholder="search_placeholder" placeholder="بحث باسم المنتج، SKU، أو التصنيف..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                
                <select id="status-filter" onchange="filterInventory()" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="all" data-i18n="filter_all">كل الحالات</option>
                    <option value="available" data-i18n="status_available">متوفر</option>
                    <option value="low" data-i18n="status_low">موشك على النفاد</option>
                    <option value="out" data-i18n="status_out">منتهي</option>
                </select>

                <select id="items-per-page" onchange="renderTable()" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="10">10 / صفحة</option>
                    <option value="25" selected>25 / صفحة</option>
                    <option value="50">50 / صفحة</option>
                </select>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 flex-wrap">
                <button id="bulk-delete-btn" onclick="deleteSelected()" class="hidden bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 px-3 py-2 rounded-lg text-xs font-semibold transition">
                    <span data-i18n="btn_delete_selected">حذف المحدّد</span> (<span id="selected-count">0</span>)
                </button>

                <button onclick="openCreateModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                    <span>➕</span> <span data-i18n="btn_add_item">إضافة صنف جديد</span>
                </button>

                <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg text-xs font-semibold cursor-pointer transition">
                    <span data-i18n="btn_import">استيراد CSV</span>
                    <input type="file" accept=".csv" onchange="importExcelFile(event)" class="hidden">
                </label>

                <button onclick="downloadCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition" data-i18n="btn_export">
                    تصدير CSV
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-950/80 text-slate-400 border-b border-slate-800 text-xs">
                        <tr>
                            <th class="py-3 px-3 text-center">
                                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)" class="rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-0 cursor-pointer">
                            </th>
                            <th class="py-3 px-3 text-center" data-i18n="th_image">الصورة</th>
                            <th class="py-3 px-3" data-i18n="th_sku">SKU</th>
                            <th class="py-3 px-3" data-i18n="th_name">اسم الصنف</th>
                            <th class="py-3 px-3" data-i18n="th_category">التصنيف</th>
                            <th class="py-3 px-3" data-i18n="th_quantity">الكمية</th>
                            <th class="py-3 px-3" data-i18n="th_min_limit">الحد الأدنى</th>
                            <th class="py-3 px-3" data-i18n="th_unit">الوحدة</th>
                            <th class="py-3 px-3" data-i18n="th_status">الحالة</th>
                            <th class="py-3 px-3 text-center" data-i18n="th_actions">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-slate-800/40">
                        <!-- البيانات سيتم توليدها ديناميكياً هنا -->
                    </tbody>
                </table>
            </div>
            
            <div class="p-3 bg-slate-950/40 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
                <span id="results-counter">جاري تحميل البيانات...</span>
            </div>
        </div>

    </main>

    <!-- Modal النافذة المنبثقة للإضافة والتعديل -->
    <div id="item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-slate-100 text-base" data-i18n="modal_title_add">تفاصيل الصنف</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-200">✕</button>
            </div>

            <form id="item-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="modal-item-id">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_sku">رمز SKU *</label>
                        <input type="text" id="modal-sku" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_unit">الوحدة</label>
                        <select id="modal-unit" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="piece">قطعة (Piece)</option>
                            <option value="box">صندوق (Box)</option>
                            <option value="kg">كيلوجرام (KG)</option>
                            <option value="meter">متر (Meter)</option>
                        </select>
                    </div>
                </div>

                <!-- حقل رابط صورة المنتج -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_image">رابط صورة المنتج (Image URL)</label>
                    <input type="url" id="modal-image-url" placeholder="https://example.com/image.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 text-left dir-ltr">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_name_ar">اسم الصنف (بالعربي) *</label>
                        <input type="text" id="modal-name-ar" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_name_en">اسم الصنف (بالإنجليزي)</label>
                        <input type="text" id="modal-name-en" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 text-left dir-ltr">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_cat_ar">التصنيف (بالعربي) *</label>
                        <input type="text" id="modal-cat-ar" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_cat_en">التصنيف (بالإنجليزي)</label>
                        <input type="text" id="modal-cat-en" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 text-left dir-ltr">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_qty">الكمية الحالية</label>
                        <input type="number" id="modal-qty" min="0" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_min">الحد الأدنى</label>
                        <input type="number" id="modal-min" min="0" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" data-i18n="lbl_status">الحالة</label>
                        <select id="modal-status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="available">متوفر</option>
                            <option value="low">موشك على النفاد</option>
                            <option value="out">منتهي</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition" data-i18n="btn_cancel">إلغاء</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-600/20" data-i18n="btn_save">حفظ التغيرات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alert Modal (رسائل التنبيه والخطأ) -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 text-center space-y-4">
            <div id="alert-icon" class="text-4xl">⚠️</div>
            <h4 id="alert-title" class="font-bold text-slate-100 text-lg">تنبيه</h4>
            <p id="alert-message" class="text-sm text-slate-400 leading-relaxed"></p>
            <button onclick="closeAlertModal()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition">موافق</button>
        </div>
    </div>

    <!-- JavaScript Script Code -->
    <script>
        // 1. تهيئة Supabase
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // 2. المتغيرات العامة والترجمة
        let inventoryItems = [];
        let currentLang = localStorage.getItem('lang') || 'ar';

        const inventoryTranslations = {
            ar: {
                subtitle: "نظام إدارة المخزون والمنتجات",
                logout: "تسجيل الخروج",
                stat_total: "إجمالي المنتجات",
                stat_low: "موشك على النفاد",
                stat_out: "منتهي من المخزون",
                search_placeholder: "بحث باسم المنتج، SKU، أو التصنيف...",
                filter_all: "كل الحالات",
                status_available: "متوفر",
                status_low: "موشك على النفاد",
                status_out: "منتهي",
                btn_delete_selected: "حذف المحدّد",
                btn_add_item: "إضافة صنف جديد",
                btn_import: "استيراد CSV",
                btn_export: "تصدير CSV",
                th_image: "الصورة",
                th_sku: "SKU",
                th_name: "اسم الصنف",
                th_category: "التصنيف",
                th_quantity: "الكمية",
                th_min_limit: "الحد الأدنى",
                th_unit: "الوحدة",
                th_status: "الحالة",
                th_actions: "الإجراءات",
                edit_btn: "تعديل",
                no_data: "لا توجد أصناف في المخزون حالياً",
                pagination_info: "عرض {count} من إجمالي {total} صنف",
                unit_piece: "قطعة",
                unit_box: "صندوق",
                unit_kg: "كيلوجرام",
                unit_meter: "متر",
                modal_title_add: "إضافة صنف جديد",
                modal_title_edit: "تعديل بيانات الصنف",
                lbl_sku: "رمز SKU *",
                lbl_image: "رابط صورة المنتج (Image URL)",
                lbl_unit: "الوحدة",
                lbl_name_ar: "اسم الصنف (بالعربي) *",
                lbl_name_en: "اسم الصنف (بالإنجليزي)",
                lbl_cat_ar: "التصنيف (بالعربي) *",
                lbl_cat_en: "التصنيف (بالإنجليزي)",
                lbl_qty: "الكمية الحالية",
                lbl_min: "الحد الأدنى",
                lbl_status: "الحالة",
                btn_cancel: "إلغاء",
                btn_save: "حفظ التغيرات"
            },
            en: {
                subtitle: "Inventory Management System",
                logout: "Logout",
                stat_total: "Total Items",
                stat_low: "Low Stock",
                stat_out: "Out of Stock",
                search_placeholder: "Search by item name, SKU, or category...",
                filter_all: "All Statuses",
                status_available: "In Stock",
                status_low: "Low Stock",
                status_out: "Out of Stock",
                btn_delete_selected: "Delete Selected",
                btn_add_item: "Add New Item",
                btn_import: "Import CSV",
                btn_export: "Export CSV",
                th_image: "Image",
                th_sku: "SKU",
                th_name: "Item Name",
                th_category: "Category",
                th_quantity: "Quantity",
                th_min_limit: "Min Limit",
                th_unit: "Unit",
                th_status: "Status",
                th_actions: "Actions",
                edit_btn: "Edit",
                no_data: "No items found in inventory",
                pagination_info: "Showing {count} of {total} items",
                unit_piece: "Piece",
                unit_box: "Box",
                unit_kg: "KG",
                unit_meter: "Meter",
                modal_title_add: "Add New Item",
                modal_title_edit: "Edit Item",
                lbl_sku: "SKU Code *",
                lbl_image: "Image URL",
                lbl_unit: "Unit",
                lbl_name_ar: "Arabic Name *",
                lbl_name_en: "English Name",
                lbl_cat_ar: "Arabic Category *",
                lbl_cat_en: "English Category",
                lbl_qty: "Current Quantity",
                lbl_min: "Min Limit",
                lbl_status: "Status",
                btn_cancel: "Cancel",
                btn_save: "Save Changes"
            }
        };

        // 3. جلب بيانات المخزون من Supabase
        async function fetchInventoryFromDB() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('inventory')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                inventoryItems = data || [];
                updateStats();
                renderTable();
            } catch (err) {
                console.error("Fetch inventory error:", err);
                showAlertModal(
                    currentLang === 'ar' ? 'خطأ في جلب البيانات' : 'Error Fetching Data',
                    err.message || (currentLang === 'ar' ? 'تعذر الاتصال بقاعدة البيانات' : 'Failed to connect to database'),
                    'error'
                );
            }
        }

        // 4. تحديث بطاقات الإحصائيات
        function updateStats() {
            const total = inventoryItems.length;
            const low = inventoryItems.filter(item => item.status === 'low' || (item.quantity <= (item.min_limit || 0) && item.quantity > 0)).length;
            const out = inventoryItems.filter(item => item.status === 'out' || item.quantity <= 0).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-low').innerText = low;
            document.getElementById('stat-out').innerText = out;
        }

        // 5. تصفية وعرض الجدول
        function filterInventory() {
            renderTable();
        }

        function getFilteredData() {
            const query = (document.getElementById('search-input').value || '').toLowerCase().trim();
            const statusFilter = document.getElementById('status-filter').value;

            return inventoryItems.filter(item => {
                const nameAr = (item.name_ar || '').toLowerCase();
                const nameEn = (item.name_en || '').toLowerCase();
                const sku = (item.sku || '').toLowerCase();
                const catAr = (item.category_ar || '').toLowerCase();
                const catEn = (item.category_en || '').toLowerCase();

                const matchesSearch = nameAr.includes(query) || nameEn.includes(query) || sku.includes(query) || catAr.includes(query) || catEn.includes(query);
                
                let matchesStatus = true;
                if (statusFilter !== 'all') {
                    if (statusFilter === 'available') matchesStatus = item.status === 'available' || (item.quantity > (item.min_limit || 0));
                    else if (statusFilter === 'low') matchesStatus = item.status === 'low' || (item.quantity <= (item.min_limit || 0) && item.quantity > 0);
                    else if (statusFilter === 'out') matchesStatus = item.status === 'out' || item.quantity <= 0;
                }

                return matchesSearch && matchesStatus;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('inventory-table-body');
            const filtered = getFilteredData();
            const itemsPerPage = parseInt(document.getElementById('items-per-page').value) || 25;
            const displayedItems = filtered.slice(0, itemsPerPage);

            const counterText = inventoryTranslations[currentLang].pagination_info
                .replace('{count}', displayedItems.length)
                .replace('{total}', filtered.length);
            document.getElementById('results-counter').innerText = counterText;

            if (displayedItems.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="py-8 text-center text-slate-500 font-medium">
                            ${inventoryTranslations[currentLang].no_data}
                        </td>
                    </tr>
                `;
                updateBulkDeleteVisibility();
                return;
            }

            tbody.innerHTML = displayedItems.map(item => {
                const name = currentLang === 'ar' ? (item.name_ar || item.name_en) : (item.name_en || item.name_ar);
                const category = currentLang === 'ar' ? (item.category_ar || item.category_en) : (item.category_en || item.category_ar);
                const unitKey = `unit_${item.unit || 'piece'}`;
                const unitLabel = inventoryTranslations[currentLang][unitKey] || item.unit;

                // الصورة الافتراضية إذا ما تم إضافة رابط أو كان الرابط معطوب
                const fallbackImg = 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=100&auto=format&fit=crop&q=80';
                const imageSrc = (item.image_url && item.image_url.trim() !== '') ? item.image_url.trim() : fallbackImg;

                let statusBadge = '';
                if (item.quantity <= 0 || item.status === 'out') {
                    statusBadge = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded-full text-[10px] font-semibold">${inventoryTranslations[currentLang].status_out}</span>`;
                } else if (item.quantity <= (item.min_limit || 0) || item.status === 'low') {
                    statusBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full text-[10px] font-semibold">${inventoryTranslations[currentLang].status_low}</span>`;
                } else {
                    statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full text-[10px] font-semibold">${inventoryTranslations[currentLang].status_available}</span>`;
                }

                return `
                    <tr class="hover:bg-slate-800/50 transition border-b border-slate-800/40">
                        <td class="py-2.5 px-3 text-center">
                            <input type="checkbox" value="${item.id}" onchange="updateBulkDeleteVisibility()" class="item-checkbox rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-0 cursor-pointer">
                        </td>
                        <td class="py-2.5 px-3 text-center">
                            <img src="${imageSrc}" alt="${name}" class="w-9 h-9 object-cover rounded-lg border border-slate-700/60 mx-auto bg-slate-900" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        </td>
                        <td class="py-2.5 px-3 font-mono text-slate-300 font-semibold">${item.sku || '-'}</td>
                        <td class="py-2.5 px-3 font-medium text-slate-100">${name || '-'}</td>
                        <td class="py-2.5 px-3 text-slate-400">${category || '-'}</td>
                        <td class="py-2.5 px-3 font-bold text-slate-200">${item.quantity ?? 0}</td>
                        <td class="py-2.5 px-3 text-amber-400 font-medium">${item.min_limit ?? 0}</td>
                        <td class="py-2.5 px-3 text-slate-400">${unitLabel}</td>
                        <td class="py-2.5 px-3">${statusBadge}</td>
                        <td class="py-2.5 px-3 text-center">
                            <div class="flex items-center justify-center gap-1.5">
                                <button type="button" onclick="openEditModal('${item.id}')" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-2.5 py-1 rounded transition text-[11px] font-medium">
                                    ${inventoryTranslations[currentLang].edit_btn}
                                </button>
                                <button type="button" onclick="deleteSingleItem('${item.id}')" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-2 py-1 rounded transition text-[11px]">
                                    🗑️
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            updateBulkDeleteVisibility();
        }

        // 6. تحديد الكل والحذف الجماعي
        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.item-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
            updateBulkDeleteVisibility();
        }

        function updateBulkDeleteVisibility() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            const bulkBtn = document.getElementById('bulk-delete-btn');
            const countSpan = document.getElementById('selected-count');

            if (checkedBoxes.length > 0) {
                bulkBtn.classList.remove('hidden');
                countSpan.innerText = checkedBoxes.length;
            } else {
                bulkBtn.classList.add('hidden');
                const selectAll = document.getElementById('select-all');
                if (selectAll) selectAll.checked = false;
            }
        }

        async function deleteSelected() {
            const checkedBoxes = document.querySelectorAll('.item-checkbox:checked');
            const ids = Array.from(checkedBoxes).map(cb => cb.value);

            if (ids.length === 0) return;

            if (confirm(currentLang === 'ar' ? `هل أنت متأكد من حذف ${ids.length} صنف بشكل نهائي؟` : `Are you sure you want to delete ${ids.length} items?`)) {
                try {
                    const { error } = await supabase.from('inventory').delete().in('id', ids);
                    if (error) throw error;
                    await fetchInventoryFromDB();
                } catch (err) {
                    showAlertModal(currentLang === 'ar' ? 'خطأ أثناء الحذف' : 'Delete Error', err.message, 'error');
                }
            }
        }

        async function deleteSingleItem(id) {
            if (confirm(currentLang === 'ar' ? "هل أنت متأكد من حذف هذا الصنف؟" : "Are you sure you want to delete this item?")) {
                try {
                    const { error } = await supabase.from('inventory').delete().eq('id', id);
                    if (error) throw error;
                    await fetchInventoryFromDB();
                } catch (err) {
                    showAlertModal(currentLang === 'ar' ? 'خطأ أثناء الحذف' : 'Delete Error', err.message, 'error');
                }
            }
        }

        // 7. إدارة Modal الإضافة والتعديل
        function openCreateModal() {
            document.getElementById('item-form').reset();
            document.getElementById('modal-item-id').value = '';
            document.getElementById('modal-title').innerText = inventoryTranslations[currentLang].modal_title_add;
            
            const modal = document.getElementById('item-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function openEditModal(id) {
            const item = inventoryItems.find(i => String(i.id) === String(id));
            if (!item) return;

            document.getElementById('modal-title').innerText = inventoryTranslations[currentLang].modal_title_edit;
            document.getElementById('modal-item-id').value = item.id;
            document.getElementById('modal-sku').value = item.sku || '';
            document.getElementById('modal-image-url').value = item.image_url || '';
            document.getElementById('modal-name-ar').value = item.name_ar || '';
            document.getElementById('modal-name-en').value = item.name_en || '';
            document.getElementById('modal-cat-ar').value = item.category_ar || '';
            document.getElementById('modal-cat-en').value = item.category_en || '';
            document.getElementById('modal-qty').value = item.quantity ?? 0;
            document.getElementById('modal-min').value = item.min_limit ?? 0;
            document.getElementById('modal-unit').value = item.unit || 'piece';
            document.getElementById('modal-status').value = item.status || 'available';

            const modal = document.getElementById('item-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('item-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('item-form').reset();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('modal-item-id').value;
            const sku = document.getElementById('modal-sku').value.trim();
            const imageUrl = document.getElementById('modal-image-url').value.trim();
            const nameAr = document.getElementById('modal-name-ar').value.trim();
            const nameEn = document.getElementById('modal-name-en').value.trim();
            const catAr = document.getElementById('modal-cat-ar').value.trim();
            const catEn = document.getElementById('modal-cat-en').value.trim();
            const qty = parseInt(document.getElementById('modal-qty').value) || 0;
            const min = parseInt(document.getElementById('modal-min').value) || 0;
            const unit = document.getElementById('modal-unit').value;
            const status = document.getElementById('modal-status').value;

            if (!sku || !nameAr || !catAr) {
                showAlertModal(
                    currentLang === 'ar' ? 'حقول مطلوبة' : 'Required Fields',
                    currentLang === 'ar' ? 'يرجى ملء جميع الحقول المفروضة (SKU، الاسم بالعربي، التصنيف).' : 'Please fill in required fields.',
                    'warning'
                );
                return;
            }

            const payload = {
                sku,
                image_url: imageUrl,
                name_ar: nameAr,
                name_en: nameEn,
                category_ar: catAr,
                category_en: catEn,
                quantity: qty,
                min_limit: min,
                unit,
                status,
                updated_at: new Date().toISOString()
            };

            try {
                let error;
                if (id) {
                    ({ error } = await supabase.from('inventory').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabase.from('inventory').insert([payload]));
                }

                if (error) throw error;

                closeModal();
                await fetchInventoryFromDB();
            } catch (err) {
                showAlertModal(currentLang === 'ar' ? 'خطأ في الحفظ' : 'Save Error', err.message, 'error');
            }
        }

        // 8. الاستيراد والتصدير
        async function importExcelFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
                    if (lines.length <= 1) throw new Error("الملف فارغ");

                    const rows = lines.slice(1);
                    const newItems = [];

                    rows.forEach(row => {
                        const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                        if (cols.length >= 2 && cols[0]) {
                            newItems.push({
                                sku: cols[0],
                                image_url: cols[1] || '',
                                name_ar: cols[2] || cols[3] || '',
                                name_en: cols[3] || '',
                                category_ar: cols[4] || cols[5] || 'عام',
                                category_en: cols[5] || 'General',
                                quantity: parseInt(cols[6]) || 0,
                                min_limit: parseInt(cols[7]) || 0,
                                unit: cols[8] || 'piece',
                                status: (parseInt(cols[6]) || 0) <= 0 ? 'out' : 'available'
                            });
                        }
                    });

                    if (newItems.length === 0) throw new Error("لا توجد بيانات صالحة");

                    const { error } = await supabase.from('inventory').upsert(newItems, { onConflict: 'sku' });
                    if (error) throw error;

                    await fetchInventoryFromDB();
                } catch (err) {
                    showAlertModal(currentLang === 'ar' ? 'خطأ في الاستيراد' : 'Import Error', err.message, 'error');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        function downloadCSV() {
            const filtered = getFilteredData();
            if (filtered.length === 0) return;

            const headers = ["SKU", "Image URL", "اسم الصنف (عربي)", "Item Name (EN)", "التصنيف (عربي)", "Category (EN)", "الكمية", "الحد الأدنى", "الوحدة", "الحالة"];
            const rows = filtered.map(i => [
                `"${i.sku || ''}"`,
                `"${i.image_url || ''}"`,
                `"${i.name_ar || ''}"`,
                `"${i.name_en || ''}"`,
                `"${i.category_ar || ''}"`,
                `"${i.category_en || ''}"`,
                i.quantity ?? 0,
                i.min_limit ?? 0,
                `"${i.unit || 'piece'}"`,
                `"${i.status || 'available'}"`
            ]);

            const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = `Keymerv_Inventory_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 9. إدارة اللغات والتنبيهات
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('lang', currentLang);
            applyInventoryLanguage(currentLang);
            renderTable();
        }

        function applyInventoryLanguage(lang) {
            document.getElementById('html-root').dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('html-root').lang = lang;
            document.getElementById('lang-btn').innerText = lang === 'ar' ? 'English' : 'عربي';

            const dict = inventoryTranslations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.placeholder = dict[key];
            });
        }

        function showAlertModal(title, msg, type = 'warning') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('alert-icon').innerText = type === 'error' ? '❌' : '⚠️';
            const alertModal = document.getElementById('alert-modal');
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }

        function closeAlertModal() {
            const alertModal = document.getElementById('alert-modal');
            alertModal.classList.add('hidden');
            alertModal.classList.remove('flex');
        }

        async function logoutUser() {
            if (supabase) await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        // 10. التشغيل الأولي للبرنامج
        document.addEventListener('DOMContentLoaded', () => {
            applyInventoryLanguage(currentLang);
            fetchInventoryFromDB();
        });

        // تصدير الوظائف للـ Global Scope
        window.closeAlertModal = closeAlertModal;
        window.toggleLanguage = toggleLanguage;
        window.logoutUser = logoutUser;
        window.importExcelFile = importExcelFile;
        window.downloadCSV = downloadCSV;
        window.filterInventory = filterInventory;
        window.renderTable = renderTable;
        window.toggleSelectAll = toggleSelectAll;
        window.deleteSelected = deleteSelected;
        window.deleteSingleItem = deleteSingleItem;
        window.openCreateModal = openCreateModal;
        window.openEditModal = openEditModal;
        window.closeModal = closeModal;
        window.handleFormSubmit = handleFormSubmit;
        window.updateBulkDeleteVisibility = updateBulkDeleteVisibility;
    </script>
</body>
</html>
